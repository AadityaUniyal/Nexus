name: Nexus CI

# Quality gate for every push / PR. Deployments:
#   - Backend  -> Azure App Service via main_nexus-api-prod.yml (publish profile)
#   - Frontend -> Vercel (Git integration, or the job below when VERCEL_TOKEN is set)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt flake8
      - name: Lint (syntax & undefined-name errors)
        run: flake8 backend --select=E9,F63,F7 --extend-exclude=backend/alembic --show-source
      - name: Security scan (advisory)
        run: |
          pip install bandit
          bandit -r backend/app -ll -ii || true
      - name: Tests
        working-directory: backend
        run: python -m pytest -q tests

  frontend-build:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --prefix frontend
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: npm run build

  deploy-vercel:
    name: Deploy frontend to Vercel
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Vercel Git integration handles deploys
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN not set; relying on Vercel Git integration."
      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

  smoke-test:
    name: Post-deploy smoke test
    needs: [deploy-vercel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for rollout, then verify
        run: |
          pip install httpx
          sleep 120
          python scripts/verify_deployment.py || echo "::warning::Smoke test failed; check Azure/Vercel logs"
