name: Nexus CI

on:
  push:
    branches: [main, "rebuild/*"]
  pull_request:
    branches: [main, "rebuild/*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-guardrails:
    name: Check Zero Fake Data & Hardcoded Mocks Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Zero-Fakes Verification Gate
        run: python scripts/check_no_fakes.py

  backend-test:
    name: Backend Lint, Security & Pytest Suite
    runs-on: ubuntu-latest
    needs: [repo-guardrails]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt flake8 bandit
      - name: Lint (syntax & undefined-name errors)
        run: flake8 backend --select=E9,F63,F7 --extend-exclude=backend/alembic --show-source
      - name: Security scan (advisory)
        run: bandit -r backend/app -ll -ii || true
      - name: Run Backend Pytest Suite
        working-directory: backend
        env:
          NEON_DATABASE_URL: "sqlite+aiosqlite:///./test_nexus.db"
          AZURE_MAPS_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
          CLERK_SECRET_KEY: "sk_test_mock"
          CLERK_JWKS_URL: "https://mock.clerk.accounts.dev/.well-known/jwks.json"
        run: python -m pytest tests -v

  frontend-check:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest
    needs: [repo-guardrails]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci --prefix frontend
      - name: Type Check
        run: npm run typecheck --prefix frontend
      - name: Lint Check
        run: npm run lint --prefix frontend
      - name: Next.js Production Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_mock_for_ci_build"
          CLERK_SECRET_KEY: "sk_test_mock_for_ci_build"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build
