name: NEXUS Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Test Suite & Compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          else
            pip install fastapi uvicorn pydantic email-validator pydantic-settings httpx sqlalchemy asyncpg alembic python-dotenv "python-jose[cryptography]" bcrypt groq loguru pipecat-ai pytest pytest-asyncio
          fi

      - name: Run Pytest Test Suite
        run: |
          python -m pytest backend/tests

  frontend-build:
    name: Frontend Type Safety & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Type Check (TypeScript)
        run: cd frontend && npx tsc --noEmit

      - name: Production Next.js Build
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:8000"
