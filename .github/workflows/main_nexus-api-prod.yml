# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - nexus-api-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-deploy-nexus-api-prod
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Create and build virtual environment
        run: |
          python -m venv --copies antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      # Include pre-built antenv, backend code, startup script, and .deployment config
      # Exclude frontend, docs, node_modules, database, and git history
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            antenv/
            !frontend/
            !database/
            !docs/
            !.git/
            !.github/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ./app-package
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'nexus-api-prod'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_92442DD8BCA840DE9A5AFAAB06E4BC33 }}
          package: ./app-package