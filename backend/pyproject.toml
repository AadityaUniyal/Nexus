[project]
name = "nexus-backend"
version = "0.1.0"
description = "NEXUS Operational Intelligence and Decision Simulation Platform Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "groq>=0.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "python-multipart>=0.0.18"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests/backend", "tests"]
pythonpath = [".", "app"]
