  <!-- Right Pillar -->
  <path d="M23 22V12" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity="0.45" />

  <!-- Flow Vector -->
  <path d="M9 10L15 18L18 15L23 9" stroke="url(#nexus-flow-sm)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Destination Delivery Point -->
