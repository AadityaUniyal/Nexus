<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Apple squircle background gradient -->
    <linearGradient id="nexus-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0D4B46" />
      <stop offset="100%" stop-color="#072B28" />
    </linearGradient>

    <!-- Tactical high-sheen rim highlight -->
    <linearGradient id="nexus-rim" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Corridors & Flow Line Gradient -->
    <linearGradient id="nexus-flow" x1="18" y1="46" x2="46" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="nexus-drop" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <radialGradient id="beacon-glow" cx="46" cy="18" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Tile (Apple macOS / iOS Superellipse proportion) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#nexus-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="15" stroke="url(#nexus-rim)" stroke-width="1.5" />

  <!-- Logistics Network Grid Mesh (Micro-subtle) -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="0.75" stroke-dasharray="2 3">
    <line x1="18" y1="14" x2="18" y2="50" />
    <line x1="32" y1="14" x2="32" y2="50" />
    <line x1="46" y1="14" x2="46" y2="50" />
    <line x1="14" y1="18" x2="50" y2="18" />
    <line x1="14" y1="32" x2="50" y2="32" />
    <line x1="14" y1="46" x2="50" y2="46" />
  </g>

  <!-- Left Origin Fleet Pillar -->
  <path d="M18 46 V20" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" filter="url(#nexus-drop)" />
  
  <!-- Right Destination Fleet Pillar -->
  <path d="M46 44 V24" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.45" />

  <!-- The Nexus Logistics Active Corridor (Connecting Origin -> Waypoint -> Destination Beacon) -->
  <path 
    d="M18 20 L30 36 L36 30 L46 18" 
    stroke="url(#nexus-flow)" 
    stroke-width="4.5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    filter="url(#nexus-drop)" 
  />

  <!-- Active Route Micro-Pulse Segment -->
  <path 
    d="M26 30.7 L30 36 L36 30 L40 24" 
    stroke="#FFFFFF" 
    stroke-width="1.75" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    opacity="0.8" 
  />

  <!-- Beacon Pulse Glow -->
  <circle cx="46" cy="18" r="7" fill="url(#beacon-glow)" />

  <!-- Destination Delivery Checkpoint (Amber-Orange Beacon) -->
  <circle cx="46" cy="18" r="4" fill="#F97316" stroke="#FFFFFF" stroke-width="1.75" filter="url(#nexus-drop)" />
</svg>
