[tool.pytest.ini_options]
testpaths = ["tests/backend", "backend/tests"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["backend", "tests"]
extraPaths = ["backend"]

[tool.pylint.master]
init-hook = 'import sys; sys.path.insert(0, "backend")'
